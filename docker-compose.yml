services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/var/www/frontend
      - ./laravel:/var/www/laravel
    depends_on:
      - php

  php:
    build: ./php
    working_dir: /var/www/laravel
    volumes:
      - ./laravel:/var/www/laravel
    depends_on:
      - db

  queue:
    build: ./php
    working_dir: /var/www/laravel
    volumes:
      - ./laravel:/var/www/laravel
    command: php artisan queue:work --tries=3
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: dwes
      MYSQL_DATABASE: demo
      MYSQL_USER: dwes
      MYSQL_PASSWORD: dwes
    volumes:
      - db_data:/var/lib/mysql

  composer:
    image: composer:2
    working_dir: /var/www/laravel
    volumes:
      - ./laravel:/var/www/laravel
    entrypoint: ["composer"]

volumes:
  db_data:
